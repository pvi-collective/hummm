<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>hummm — Redfern Field</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" aria-busy="true">
    <p class="eyebrow">hummm · redfern field</p>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>move and connect</h1>
    <p class="instruction" id="instruction">let the street speak through the strap.</p>
    <section class="field-reading" aria-labelledby="fieldReading">
      <p class="field-reading__label" id="fieldReading">field</p>
      <p class="field-reading__value" id="fieldValue">waiting</p>
      <p class="field-reading__hint" id="fieldHint">concrete is never silent.</p>
    </section>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <span class="loader__line" aria-hidden="true"></span>
      <span id="loaderText">preparing local field</span>
    </div>
    <button class="play" id="startButton" type="button" disabled>preparing field</button>
    <div class="controls"><button class="stop" id="stopButton" type="button" disabled>stop</button></div>
    <p class="status" id="status" role="status" aria-live="polite">loading Redfern tree field</p>
    <p class="gps-point" id="gpsPoint">gps point · waiting</p>
    <p class="debug" id="debug">City of Sydney tree data · GPS stays on this device.</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
