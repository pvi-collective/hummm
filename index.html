<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>hummm — pcc connector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" aria-busy="true">
    <p class="eyebrow">hummm · pcc · v0.18.1</p>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1 id="connectorTitle">connector</h1>
    <p class="instruction" id="instruction">move · find a tree</p>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <span class="loader__line" aria-hidden="true"></span>
      <span id="loaderText">preparing local connection</span>
    </div>
    <button class="play" id="startButton" type="button" disabled>preparing connection</button>
    <div class="controls"><button class="stop" id="stopButton" type="button" disabled>stop</button></div>
    <p class="status" id="status" role="status" aria-live="polite">loading boorloo connection</p>
    <p class="tree-point" id="treePoint">nearest tree · waiting</p>
    <p class="gps-point" id="gpsPoint">gps point · waiting</p>
    <p class="debug" id="debug">city of perth tree data · gps stays on this device.</p>
  </main>
  <script src="app.js?v=0.18.1" defer></script>
</body>
</html>
