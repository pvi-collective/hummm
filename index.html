<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>hummm — Haptic Composer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <p class="eyebrow">hummm · haptic composer</p>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>haptic composer</h1>
    <p class="instruction" id="instruction">move slowly. notice where the feeling changes.</p>

    <section class="evolution" aria-labelledby="evolutionLabel">
      <div class="evolution__labels" aria-hidden="true">
        <span>far</span>
        <span>close</span>
      </div>
      <label class="sr-only" id="evolutionLabel" for="evolutionSlider">heartbeat evolution, from far to close</label>
      <input class="evolution__slider" id="evolutionSlider" type="range" min="0" max="100" value="0" step="1">
      <p class="evolution__hint" id="evolutionHint">distant · spacious · quiet</p>
    </section>

    <button class="play" id="playButton" type="button">feel the rhythm</button>
    </div>

    <div class="controls">
      <label class="loop-control">
        <input id="loopToggle" type="checkbox">
        <span>loop</span>
      </label>
      <button class="stop" id="stopButton" type="button" disabled>stop</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">ready</p>
    <p class="debug" id="debug">audio output follows your phone’s selected Bluetooth device.</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
