<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>hummm — Haptic Composer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <p class="eyebrow">hummm · haptic composer</p>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>haptic composer</h1>
    <p class="instruction" id="instruction">choose a state. feel it in your body.</p>

    <div class="states" aria-label="haptic states">
      <button class="state" type="button" data-state="awakening">awakening</button>
      <button class="state" type="button" data-state="invitation">invitation</button>
      <button class="state" type="button" data-state="curiosity">curiosity</button>
      <button class="state" type="button" data-state="purpose">purpose</button>
      <button class="state state--distress" type="button" data-state="distress">distress</button>
      <button class="state" type="button" data-state="relief">relief</button>
    </div>

    <div class="controls">
      <label class="loop-control">
        <input id="loopToggle" type="checkbox">
        <span>loop</span>
      </label>
      <button class="stop" id="stopButton" type="button" disabled>stop</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">ready</p>
    <p class="debug" id="debug">audio output follows your phone’s selected Bluetooth device.</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
